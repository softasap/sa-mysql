---
# Docker-scenario verification: package presence plus a live version
# query (mysqld is started by the package postinst via systemd).
# Service-facts assertions are skipped per boilerplate convention —
# the functional query below already proves the server is up.
- name: Verify MySQL installation (docker)
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Verify | MySQL server package is installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify | Assert mysql-community-server present
      ansible.builtin.assert:
        that:
          - "'mysql-community-server' in ansible_facts.packages"
        fail_msg: "mysql-community-server is not installed"
        success_msg: "mysql-community-server is installed"

    - name: Verify | Query server version with root credentials
      ansible.builtin.command:
        cmd: mysql --defaults-file=/root/.my.cnf -N -B -e "SELECT VERSION();"
      register: mysql_version_query
      changed_when: false

    - name: Verify | Assert reported version is expected LTS series
      ansible.builtin.assert:
        that:
          - mysql_version_query.stdout.startswith(mysql_expected_series)
        fail_msg: >-
          Expected MySQL {{ mysql_expected_series }} LTS, server reports:
          {{ mysql_version_query.stdout }}
        success_msg: "Server reports {{ mysql_version_query.stdout }}"

    - name: Verify | Report installed MySQL version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: MySQL {{ mysql_version_query.stdout }} (expected {{ mysql_expected_series }} LTS)"
