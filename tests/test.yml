---
# Legacy direct-playbook test entry point (not used by molecule).
# The role name is never hardcoded: pass it via extra vars, e.g.
#   ansible-playbook -i inventory -e role_under_test=sa-mysql tests/test.yml
- name: Test role under test
  hosts: all
  vars:
    ansible_python_interpreter: auto

  tasks:
    - name: Apply role under test
      ansible.builtin.include_role:
        name: "{{ role_under_test }}"
