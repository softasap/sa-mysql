---
# Idempotent replacement for `mysql_secure_installation`:
# removes anonymous users, remote root accounts and the test database.
# Root password itself is preseeded via debconf at install time
# (see tasks_mysql.yml).

- name: MYSQL | Harden | Collect insecure accounts
  ansible.mysql.mysql_query:
    query:
      - SELECT User, Host FROM mysql.user WHERE User = ''
      - SELECT User, Host FROM mysql.user WHERE User = '{{ mysql_root_user }}' AND Host NOT IN ('localhost', '127.0.0.1', '::1')
    login_user: "{{ mysql_root_user }}"
    login_password: "{{ mysql_root_password }}"
  no_log: true
  register: mysql_harden_accounts
  changed_when: false

- name: MYSQL | Harden | Remove anonymous users
  ansible.mysql.mysql_query:
    query: DELETE FROM mysql.user WHERE User = ''
    login_user: "{{ mysql_root_user }}"
    login_password: "{{ mysql_root_password }}"
  no_log: true
  when: mysql_harden_accounts.query_result[0] | length > 0

- name: MYSQL | Harden | Remove remote root accounts
  ansible.mysql.mysql_query:
    query: >-
      DELETE FROM mysql.user
      WHERE User = '{{ mysql_root_user }}'
      AND Host NOT IN ('localhost', '127.0.0.1', '::1')
    login_user: "{{ mysql_root_user }}"
    login_password: "{{ mysql_root_password }}"
  no_log: true
  when: mysql_harden_accounts.query_result[1] | length > 0

- name: MYSQL | Harden | Check for test database
  ansible.mysql.mysql_query:
    query: SHOW DATABASES LIKE 'test'
    login_user: "{{ mysql_root_user }}"
    login_password: "{{ mysql_root_password }}"
  no_log: true
  register: mysql_harden_testdb
  changed_when: false

- name: MYSQL | Harden | Drop test database
  ansible.mysql.mysql_query:
    query: DROP DATABASE IF EXISTS test
    login_user: "{{ mysql_root_user }}"
    login_password: "{{ mysql_root_password }}"
  no_log: true
  when: mysql_harden_testdb.query_result[0] | length > 0

- name: MYSQL | Harden | Flush privileges
  ansible.mysql.mysql_query:
    query: FLUSH PRIVILEGES
    login_user: "{{ mysql_root_user }}"
    login_password: "{{ mysql_root_password }}"
  no_log: true
  when: >-
    mysql_harden_accounts.query_result[0] | length > 0
    or mysql_harden_accounts.query_result[1] | length > 0
    or mysql_harden_testdb.query_result[0] | length > 0
