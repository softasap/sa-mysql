---
# Manages databases and users via community.mysql modules.
# Requires PyMySQL on the target (installed in tasks_mysql.yml)
# and the community.mysql/ansible.mysql collection on the controller.

- name: MYSQL | Create databases
  ansible.mysql.mysql_db:
    name: "{{ item.name }}"
    collation: "{{ item.collation | default('utf8mb4_general_ci') }}"
    encoding: "{{ item.encoding | default('utf8mb4') }}"
    state: present
    login_host: "{{ mysql_host | default('localhost') }}"
    login_user: "{{ mysql_root_user }}"
    login_password: "{{ mysql_root_password }}"
  with_items: "{{ mysql_databases }}"
  no_log: true

- name: MYSQL | Create users
  ansible.mysql.mysql_user:
    name: "{{ item.name }}"
    host: "{{ item.host | default('localhost') }}"
    # plugin_auth_string (not password) keeps the module on the
    # "IDENTIFIED WITH <plugin> BY <pw>" code path: mysql_native_password
    # is disabled in MySQL 8.4 and removed in 9.x, and the module's
    # plain-password branch still hardcodes it (gated < 9.7 upstream).
    plugin: "{{ item.plugin | default('caching_sha2_password') }}"
    plugin_auth_string: "{{ item.password }}"
    priv: "{{ item.priv | default('*.*:USAGE') }}"
    state: "{{ item.state | default('present') }}"
    append_privs: "{{ item.append_privs | default(false) }}"
    login_host: "{{ mysql_host | default('localhost') }}"
    login_user: "{{ mysql_root_user }}"
    login_password: "{{ mysql_root_password }}"
  with_items: "{{ mysql_users }}"
  no_log: true
